<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-6%" y="-20%" width="112%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="685" fill="#FFFFFF"/>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#16233A">Enterprise Agentic Reference Architecture for Databricks</text>

  <!-- legend -->
  <rect x="990" y="34" width="9" height="9" rx="2" fill="#E1503A"/>
  <text x="1005" y="42" font-size="10" fill="#16233A">Databricks</text>
  <rect x="1085" y="34" width="9" height="9" rx="2" fill="#2E6DB4"/>
  <text x="1100" y="42" font-size="10" fill="#16233A">Neo4j</text>

  <!-- ===================== AGENTIC APPS ===================== -->
  <rect x="30" y="75" width="1140" height="70" rx="12" fill="#F1F1EE" stroke="#DAD7CE" filter="url(#sh)"/>
  <text x="50" y="110" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">AGENTIC APPS</text>
  <rect x="310" y="88" width="250" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="435" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Apps</text>
  <rect x="605" y="88" width="250" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="730" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Agents</text>
  <rect x="900" y="88" width="250" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="1025" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Tools</text>

  <!-- ===================== AGENTIC SERVICES ===================== -->
  <rect x="30" y="161" width="1140" height="160" rx="12" fill="#F1F1EE" stroke="#DAD7CE" filter="url(#sh)"/>
  <text x="50" y="231" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">AGENTIC</text>
  <text x="50" y="251" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">SERVICES</text>

  <!-- three service boxes -->
  <rect x="180" y="178" width="298" height="70" rx="10" fill="#E1503A" stroke="#B23A26" stroke-width="1.6"/>
  <text x="329" y="213" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#FFFFFF">Genie One</text>
  <rect x="516" y="178" width="298" height="70" rx="10" fill="#E1503A" stroke="#B23A26" stroke-width="1.6"/>
  <text x="665" y="213" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#FFFFFF">Genie Agents</text>
  <rect x="851" y="178" width="298" height="70" rx="10" fill="#E1503A" stroke="#B23A26" stroke-width="1.6"/>
  <text x="1000" y="213" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#FFFFFF">Agent Bricks</text>

  <!-- Genie Ontology (Databricks) + EKL bar (Neo4j) -->
  <rect x="180" y="256" width="150" height="48" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="255" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Genie Ontology</text>
  <rect x="346" y="256" width="803" height="48" rx="8" fill="#2E6DB4" stroke="#1F4E86" stroke-width="1.6"/>
  <text x="363" y="280" dominant-baseline="central" font-size="12" font-weight="700" fill="#FFFFFF">Neo4j Enterprise Knowledge Layer - Open Access</text>
  <rect x="725" y="269" width="99" height="22" rx="6" fill="#FFFFFF"/>
  <text x="774" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1F4E86">Domain Model</text>
  <rect x="830" y="269" width="99" height="22" rx="6" fill="#FFFFFF"/>
  <text x="879" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1F4E86">Semantic Map</text>
  <rect x="935" y="269" width="99" height="22" rx="6" fill="#FFFFFF"/>
  <text x="984" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1F4E86">Agent Memory</text>
  <rect x="1040" y="269" width="99" height="22" rx="6" fill="#FFFFFF"/>
  <text x="1089" y="280" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#1F4E86">Context Graph</text>

  <!-- ===================== UNIFIED GOVERNANCE ===================== -->
  <rect x="30" y="337" width="1140" height="70" rx="12" fill="#F1F1EE" stroke="#DAD7CE" filter="url(#sh)"/>
  <text x="50" y="365" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">UNIFIED</text>
  <text x="50" y="383" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">GOVERNANCE</text>
  <rect x="280" y="350" width="300" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="430" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Unity Catalog</text>
  <rect x="640" y="350" width="300" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="790" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Unity Gateway</text>

  <!-- ===================== NEO4J ===================== -->
  <rect x="30" y="423" width="1140" height="70" rx="12" fill="#EEF4FB" stroke="#6E86CF" filter="url(#sh)"/>
  <text x="50" y="451" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1F4E86">NEO4J</text>
  <text x="50" y="469" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#1F4E86">INTEGRATION</text>

  <!-- integration bridges + load -->
  <rect x="310" y="436" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2"/>
  <text x="435" y="458" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1F4E86">Neo4j MCP Server</text>
  <rect x="605" y="436" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2"/>
  <text x="730" y="458" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1F4E86">Spark Connector</text>
  <rect x="900" y="436" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2"/>
  <text x="1025" y="458" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1F4E86">Data Import</text>

  <!-- ===================== AGENTIC DATA ===================== -->
  <rect x="30" y="509" width="1140" height="70" rx="12" fill="#F1F1EE" stroke="#DAD7CE" filter="url(#sh)"/>
  <text x="50" y="544" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">AGENTIC DATA</text>
  <rect x="210" y="522" width="172" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="296" y="544" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Lakeflow</text>
  <rect x="402" y="522" width="172" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="488" y="544" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Lakehouse</text>
  <rect x="594" y="522" width="172" height="44" rx="8" fill="#FBEDEA" stroke="#E1503A"/>
  <text x="680" y="544" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#B23A26">Lakebase</text>
  <rect x="786" y="522" width="172" height="44" rx="8" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2"/>
  <text x="872" y="544" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1F4E86">Virtual Graph</text>
  <rect x="978" y="522" width="172" height="44" rx="8" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="2"/>
  <text x="1064" y="544" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1F4E86">Neo4j AuraDB</text>

  <!-- ===================== OPEN INFRASTRUCTURE ===================== -->
  <rect x="30" y="595" width="1140" height="70" rx="12" fill="#EDEAE2" stroke="#DAD7CE" filter="url(#sh)"/>
  <text x="50" y="630" dominant-baseline="central" font-size="13" font-weight="700" letter-spacing="0.5" fill="#16233A">OPEN INFRASTRUCTURE</text>
  <text x="470" y="630" dominant-baseline="central" font-size="14" fill="#5C6470">Open Format Data Lake   ·   Delta Lake   ·   Iceberg</text>
  <text x="1150" y="630" text-anchor="end" dominant-baseline="central" font-size="14" fill="#5C6470">Any Cloud   ·   Any Model   ·   Any Data</text>
</svg>
