[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-neocarta-prototype"
version = "0.1.0"
description = "Local Neocarta prototype for the Finance Genie semantic investigation demo."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "neocarta[cli,databricks,mcp]",
]

[project.scripts]
finance-semantic-demo = "demo_trace:main"
finance-semantic-ingest = "ingest:main"
finance-semantic-mcp = "mcp_server:main"
finance-semantic-validate-demo = "validate_demo:main"
finance-semantic-validate-embeddings = "validate_embeddings:main"
finance-semantic-validate-graph = "validate_semantic:main"
finance-semantic-validate-mcp = "validate_mcp:main"
finance-semantic-validate-sources = "validate_sources:main"
finance-semantic-validate-store = "validate_store:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv.sources]
neocarta = { git = "https://github.com/neo4j-labs/neocarta.git", rev = "ba6bf7945bf9c60640c664a03ccc26d0013996bf" }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "business_context",
    "config",
    "demo_trace",
    "ingest",
    "mcp_server",
    "runtime_contract",
    "semantic_graph",
    "validate_demo",
    "validate_embeddings",
    "validate_mcp",
    "validate_semantic",
    "validate_sources",
    "validate_store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
