<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How one turn uses NAMS</title>
  <desc id="d">The app asks the TurnRecorder to recall the user's recent conversations from NAMS, runs the agent with the recalled text in its instructions, returns the answer, and then writes the turn to NAMS as a conversation with messages and a reasoning trace.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker></defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <rect x="4" y="76" width="952" height="216" rx="6" fill="#e8f7ee" opacity="0.55"/>
  <text x="12" y="92" font-size="11" font-weight="bold" fill="#2d3748">RECALL</text>
  <rect x="4" y="296" width="952" height="136" rx="6" fill="#eef4ff" opacity="0.55"/>
  <text x="12" y="312" font-size="11" font-weight="bold" fill="#2d3748">ANSWER</text>
  <rect x="4" y="436" width="952" height="150" rx="6" fill="#e8f7ee" opacity="0.55"/>
  <text x="12" y="452" font-size="11" font-weight="bold" fill="#2d3748">WRITE</text>
  <line x1="120" y1="56" x2="120" y2="590" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="50" y="14" width="140" height="40" rx="8" fill="#fff6e5" stroke="#d9822b" stroke-width="2"/>
  <text x="120" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Caller</text>
  <line x1="290" y1="56" x2="290" y2="590" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="220" y="14" width="140" height="40" rx="8" fill="#f4f6fa" stroke="#4a5568" stroke-width="2"/>
  <text x="290" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Agent</text>
  <line x1="465" y1="56" x2="465" y2="590" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="395" y="14" width="140" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="465" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">App adapter</text>
  <line x1="640" y1="56" x2="640" y2="590" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="570" y="14" width="140" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="640" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">TurnRecorder</text>
  <line x1="870" y1="56" x2="870" y2="590" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="800" y="14" width="140" height="40" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="2"/>
  <text x="870" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">NAMS</text>
  <line x1="132" y1="104" x2="463" y2="104" stroke="#2d3748" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="292.5" y="98" text-anchor="middle" font-size="11" fill="#1a202c">question and user_id</text>
  <circle cx="120" cy="104" r="9" fill="#2d3748"/><text x="120" y="108" text-anchor="middle" font-size="11" fill="#ffffff">1</text>
  <line x1="477" y1="140" x2="638" y2="140" stroke="#2d3748" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="552.5" y="134" text-anchor="middle" font-size="11" fill="#1a202c">recall()</text>
  <circle cx="465" cy="140" r="9" fill="#2d3748"/><text x="465" y="144" text-anchor="middle" font-size="11" fill="#ffffff">2</text>
  <line x1="646" y1="170" x2="868" y2="170" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="755.0" y="164" text-anchor="middle" font-size="11" fill="#1a202c">list_conversations</text>
  <line x1="646" y1="200" x2="868" y2="200" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="755.0" y="194" text-anchor="middle" font-size="11" fill="#1a202c">get_context, latest 2</text>
  <line x1="864" y1="230" x2="642" y2="230" stroke="#2f855a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="755.0" y="224" text-anchor="middle" font-size="11" fill="#1a202c">context text</text>
  <line x1="634" y1="258" x2="467" y2="258" stroke="#2d3748" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="552.5" y="252" text-anchor="middle" font-size="11" fill="#1a202c">recalled text</text>
  <text x="300" y="280" font-size="10.5" fill="#4a5568">Keeps the 2 latest conversations of this user. Waits at most 10 seconds. Cuts the text at 2000 characters.</text>
  <line x1="453" y1="322" x2="292" y2="322" stroke="#2d3748" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="377.5" y="316" text-anchor="middle" font-size="11" fill="#1a202c">run with recalled text</text>
  <circle cx="465" cy="322" r="9" fill="#2d3748"/><text x="465" y="326" text-anchor="middle" font-size="11" fill="#ffffff">3</text>
  <line x1="296" y1="354" x2="463" y2="354" stroke="#2d3748" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="377.5" y="348" text-anchor="middle" font-size="11" fill="#1a202c">tool calls and answer</text>
  <line x1="477" y1="386" x2="638" y2="386" stroke="#2d3748" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="552.5" y="380" text-anchor="middle" font-size="11" fill="#1a202c">add_tool_call, set_answer</text>
  <circle cx="465" cy="386" r="9" fill="#2d3748"/><text x="465" y="390" text-anchor="middle" font-size="11" fill="#ffffff">4</text>
  <text x="480" y="402" font-size="10.5" fill="#4a5568">The recorder buffers both. Streaming adds no wait.</text>
  <line x1="453" y1="424" x2="122" y2="424" stroke="#2d3748" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="292.5" y="418" text-anchor="middle" font-size="11" fill="#1a202c">answer</text>
  <circle cx="465" cy="424" r="9" fill="#2d3748"/><text x="465" y="428" text-anchor="middle" font-size="11" fill="#ffffff">5</text>
  <line x1="477" y1="468" x2="638" y2="468" stroke="#2d3748" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="552.5" y="462" text-anchor="middle" font-size="11" fill="#1a202c">leave the context, flush</text>
  <circle cx="465" cy="468" r="9" fill="#2d3748"/><text x="465" y="472" text-anchor="middle" font-size="11" fill="#ffffff">6</text>
  <line x1="646" y1="496" x2="868" y2="496" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="755.0" y="490" text-anchor="middle" font-size="11" fill="#1a202c">create_conversation, add_message user</text>
  <line x1="646" y1="524" x2="868" y2="524" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="755.0" y="518" text-anchor="middle" font-size="11" fill="#1a202c">start_trace, add_step, record_tool_call</text>
  <line x1="646" y1="552" x2="868" y2="552" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="755.0" y="546" text-anchor="middle" font-size="11" fill="#1a202c">add_message assistant, complete_trace</text>
  <text x="12" y="582" font-size="10.5" fill="#4a5568">A recovery run skips the write. Any NAMS failure is logged and the answer still returns.</text>
</svg>
