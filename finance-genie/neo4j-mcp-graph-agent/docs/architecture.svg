<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the neo4j-mcp-graph-agent with NAMS memory</title>
  <desc id="d">A caller sends a question to the Databricks App. The app recalls memory from NAMS, asks the model and reads the Neo4j graph through a Unity Catalog MCP service, returns the answer, and writes the turn to NAMS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Databricks App -->
  <rect x="250" y="50" width="320" height="400" rx="12" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="410" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1c3a9e">Databricks App</text>
  <text x="410" y="94" text-anchor="middle" font-size="12" fill="#1c3a9e">agent-bricks-neo4j-graph-agent</text>

  <rect x="270" y="104" width="280" height="62" rx="8" fill="#ffffff" stroke="#3b5bdb"/>
  <text x="410" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Durable server</text>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#4a5568">/api/invocations</text>

  <rect x="270" y="200" width="280" height="70" rx="8" fill="#ffffff" stroke="#3b5bdb"/>
  <text x="410" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Agent</text>
  <text x="410" y="248" text-anchor="middle" font-size="12" fill="#4a5568">OpenAI Agents SDK and guardrails</text>

  <rect x="270" y="304" width="280" height="70" rx="8" fill="#ffffff" stroke="#3b5bdb"/>
  <text x="410" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">TurnMemory</text>
  <text x="410" y="352" text-anchor="middle" font-size="12" fill="#4a5568">agent/nams.py</text>

  <line x1="410" y1="166" x2="410" y2="198" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="304" x2="410" y2="272" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="292" font-size="11" fill="#4a5568">recalled text</text>

  <!-- Caller -->
  <rect x="20" y="90" width="190" height="110" rx="10" fill="#fff6e5" stroke="#d9822b" stroke-width="2"/>
  <text x="115" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Caller</text>
  <text x="115" y="144" text-anchor="middle" font-size="12" fill="#4a5568">Traffic CLI, Databricks Job,</text>
  <text x="115" y="161" text-anchor="middle" font-size="12" fill="#4a5568">or any client</text>
  <text x="115" y="182" text-anchor="middle" font-size="11" fill="#4a5568">sends user_id and messages</text>

  <!-- Secrets -->
  <rect x="20" y="330" width="190" height="110" rx="10" fill="#fdeeee" stroke="#c53030" stroke-width="2"/>
  <text x="115" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Secret scope nams</text>
  <text x="115" y="384" text-anchor="middle" font-size="12" fill="#4a5568">key memory-api-key</text>
  <text x="115" y="406" text-anchor="middle" font-size="11" fill="#4a5568">app resource nams-api-key</text>
  <text x="115" y="422" text-anchor="middle" font-size="11" fill="#4a5568">sets MEMORY_API_KEY</text>
  <line x1="210" y1="385" x2="268" y2="350" stroke="#c53030" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- AI Gateway -->
  <rect x="700" y="60" width="240" height="64" rx="10" fill="#f4f6fa" stroke="#4a5568" stroke-width="2"/>
  <text x="820" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">AI Gateway model</text>
  <text x="820" y="108" text-anchor="middle" font-size="12" fill="#4a5568">system.ai.claude-sonnet-4-5</text>

  <!-- MCP -->
  <rect x="700" y="170" width="240" height="76" rx="10" fill="#f4f6fa" stroke="#4a5568" stroke-width="2"/>
  <text x="820" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Unity Catalog MCP service</text>
  <text x="820" y="218" text-anchor="middle" font-size="12" fill="#4a5568">finance_genie_mcp</text>
  <text x="820" y="235" text-anchor="middle" font-size="11" fill="#4a5568">read-only Cypher on Neo4j</text>

  <!-- NAMS -->
  <rect x="700" y="290" width="240" height="96" rx="10" fill="#e8f7ee" stroke="#2f855a" stroke-width="2"/>
  <text x="820" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">NAMS</text>
  <text x="820" y="338" text-anchor="middle" font-size="12" fill="#4a5568">memory.neo4jlabs.com</text>
  <text x="820" y="358" text-anchor="middle" font-size="11" fill="#4a5568">conversations, messages,</text>
  <text x="820" y="374" text-anchor="middle" font-size="11" fill="#4a5568">traces, entities</text>

  <!-- Session store -->
  <rect x="700" y="410" width="240" height="46" rx="10" fill="#f4f6fa" stroke="#4a5568" stroke-width="2"/>
  <text x="820" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Session store, MLflow traces</text>
  <text x="820" y="446" text-anchor="middle" font-size="11" fill="#4a5568">kept by Agent Bricks</text>

  <!-- Flow arrows -->
  <line x1="210" y1="120" x2="268" y2="120" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="239" cy="108" r="9" fill="#2d3748"/><text x="239" y="112" text-anchor="middle" font-size="11" fill="#ffffff">1</text>

  <line x1="268" y1="152" x2="212" y2="152" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="239" cy="170" r="9" fill="#2d3748"/><text x="239" y="174" text-anchor="middle" font-size="11" fill="#ffffff">4</text>

  <!-- 2 recall: NAMS to TurnMemory -->
  <line x1="698" y1="322" x2="552" y2="322" stroke="#2f855a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="625" cy="309" r="9" fill="#2f855a"/><text x="625" y="313" text-anchor="middle" font-size="11" fill="#ffffff">2</text>

  <!-- 5 write: TurnMemory to NAMS -->
  <line x1="552" y1="356" x2="698" y2="356" stroke="#2f855a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="625" cy="372" r="9" fill="#2f855a"/><text x="625" y="376" text-anchor="middle" font-size="11" fill="#ffffff">5</text>

  <!-- 3 model and graph -->
  <line x1="552" y1="212" x2="698" y2="100" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="625" cy="156" r="9" fill="#2d3748"/><text x="625" y="160" text-anchor="middle" font-size="11" fill="#ffffff">3</text>
  <line x1="552" y1="236" x2="698" y2="214" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="625" cy="225" r="9" fill="#2d3748"/><text x="625" y="229" text-anchor="middle" font-size="11" fill="#ffffff">3</text>

  <!-- 6 session store -->
  <line x1="572" y1="432" x2="698" y2="432" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <circle cx="635" cy="418" r="9" fill="#2d3748"/><text x="635" y="422" text-anchor="middle" font-size="11" fill="#ffffff">6</text>
</svg>
