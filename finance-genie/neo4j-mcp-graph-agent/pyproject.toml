[project]
name = "neo4j-mcp-graph-agent"
version = "0.1.0"
description = "End-to-end Databricks provisioning and Model Serving agent for an external Neo4j MCP server."
requires-python = ">=3.12"
dependencies = [
    "databricks-agents>=1.10.2",
    "databricks-job-runner>=0.6.2",
    "databricks-langchain",
    "databricks-mcp",
    "databricks-sdk>=0.110.0",
    "langchain-core",
    "langgraph",
    "langgraph-prebuilt",
    "mcp",
    "mlflow>=3.1.3",
    "nest-asyncio",
    "pydantic>=2",
    "python-dotenv",
    "requests",
]

[tool.uv]
package = false
