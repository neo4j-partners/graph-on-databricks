[project]
name = "neo4j-mcp-graph-agent"
version = "0.1.0"
description = "Databricks App agent that answers graph questions through a Neo4j MCP service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks[openai]>=0.4.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "mlflow>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
agent-evaluate = "agent.evaluate:evaluate"
