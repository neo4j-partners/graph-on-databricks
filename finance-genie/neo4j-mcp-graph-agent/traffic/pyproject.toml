[project]
name = "nams-traffic"
version = "0.1.0"
description = "Synthetic analyst traffic for the neo4j-mcp-graph-agent app, to populate NAMS"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.124.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nams_traffic"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
agent-traffic = "nams_traffic.cli:main"
