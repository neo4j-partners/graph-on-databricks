[project]
name = "graph-fraud-analyst"
dynamic = ["version"]
description = "Full-stack Databricks App for fraud ring detection using live Neo4j graph queries and Delta Lake materialization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "neo4j>=5.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ty>=0.0.12",
]

[tool.apx.metadata]
app-name = "graph-fraud-analyst"
app-slug = "graph_fraud_analyst"
app-entrypoint = "graph_fraud_analyst.backend.app:app"
api-prefix = "/api"
metadata-path = "src/graph_fraud_analyst/_metadata.py"

[tool.apx.ui]
root = "src/graph_fraud_analyst/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/graph_fraud_analyst/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/graph_fraud_analyst/__dist__", "src/graph_fraud_analyst/_metadata.py"]
exclude = ["src/graph_fraud_analyst/ui"]
